<svg width="760" viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>AsyncConfigPortal with four optional, opt-in modules</title>
<desc>The library contains a Core block that is always compiled and depends on ESPAsyncWebServer and HttpDigestAuth. It also ships four optional, header-only modules that are opt-in: the net module (NetConfigComponent), the MQTT module (MqttConfigComponent) and the syslog module (SyslogConfigComponent) depend on the NetworkProfile library, and the status module (NetStatusComponent) depends on NetworkManager. Each dependency is pulled in only when the application includes the module that needs it. Solid means always; dashed means optional module and its conditional dependency.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="30" y="44" width="700" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="42" y="68" font-size="14" font-weight="500" fill="#2C2C2A">AsyncConfigPortal</text>
<text x="42" y="84" font-size="12" fill="#5F5E5A">reusable library</text>

<rect x="52" y="98" width="150" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="127" y="120" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">Core</text>
<text x="127" y="139" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">server · pages · utils</text>
<text x="127" y="155" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">marker · OTA · backup</text>

<rect x="214" y="98" width="119" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="273.5" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Net module</text>
<text x="273.5" y="139" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">NetConfigComponent</text>
<text x="273.5" y="155" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ net pages</text>

<rect x="341" y="98" width="119" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="400.5" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">MQTT module</text>
<text x="400.5" y="139" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">MqttConfigComponent</text>
<text x="400.5" y="155" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ mqtt pages</text>

<rect x="468" y="98" width="119" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="527.5" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Syslog module</text>
<text x="527.5" y="139" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">SyslogConfigComponent</text>
<text x="527.5" y="155" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ syslog page</text>

<rect x="595" y="98" width="119" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="654.5" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Status module</text>
<text x="654.5" y="139" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">NetStatusComponent</text>
<text x="654.5" y="155" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ status page</text>

<rect x="30" y="262" width="164" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="112" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">ESPAsyncWebServer</text>
<text x="112" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">always</text>

<rect x="208" y="262" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="283" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">HttpDigestAuth</text>
<text x="283" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">always</text>

<rect x="372" y="262" width="176" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="460" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NetworkProfile</text>
<text x="460" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">net, MQTT or syslog module</text>

<rect x="562" y="262" width="168" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="646" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NetworkManager</text>
<text x="646" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">status module only</text>

<line x1="100" y1="194" x2="100" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160" y1="194" x2="265" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="273" y1="194" x2="410" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="400" y1="194" x2="450" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="527" y1="194" x2="500" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="654" y1="194" x2="648" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<text x="380" y="336" font-size="12" fill="#5F5E5A" text-anchor="middle">solid = always compiled · dashed = optional module &amp; the dependency its include pulls in</text>
</svg>
