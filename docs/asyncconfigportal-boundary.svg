<svg width="760" viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>AsyncConfigPortal with three optional, opt-in modules</title>
<desc>The library contains a Core block that is always compiled and depends on ESPAsyncWebServer and HttpDigestAuth. It also ships three optional, header-only modules that are opt-in: the net module (NetConfigComponent) and the MQTT module (MqttConfigComponent) depend on the NetworkProfile library, and the status module (NetStatusComponent) depends on NetworkManager. Each dependency is pulled in only when the application includes the module that needs it. Solid means always; dashed means optional module and its conditional dependency.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="30" y="44" width="700" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="42" y="68" font-size="14" font-weight="500" fill="#2C2C2A">AsyncConfigPortal</text>
<text x="42" y="84" font-size="12" fill="#5F5E5A">reusable library</text>

<rect x="52" y="98" width="176" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="140" y="120" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">Core</text>
<text x="140" y="139" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">server · pages · utils</text>
<text x="140" y="155" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">marker · OTA · backup</text>

<rect x="244" y="98" width="150" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="319" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Net module</text>
<text x="319" y="139" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">NetConfigComponent</text>
<text x="319" y="155" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ net pages</text>

<rect x="404" y="98" width="150" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="479" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">MQTT module</text>
<text x="479" y="139" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">MqttConfigComponent</text>
<text x="479" y="155" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ mqtt pages</text>

<rect x="564" y="98" width="150" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<text x="639" y="120" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Status module</text>
<text x="639" y="139" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">NetStatusComponent</text>
<text x="639" y="155" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ status page</text>

<rect x="30" y="262" width="164" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="112" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">ESPAsyncWebServer</text>
<text x="112" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">always</text>

<rect x="208" y="262" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="283" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">HttpDigestAuth</text>
<text x="283" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">always</text>

<rect x="372" y="262" width="176" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="460" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NetworkProfile</text>
<text x="460" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">net or MQTT module</text>

<rect x="562" y="262" width="168" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="646" y="277" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NetworkManager</text>
<text x="646" y="295" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">status module only</text>

<line x1="112" y1="194" x2="112" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="194" x2="270" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="319" y1="194" x2="424" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="479" y1="194" x2="496" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="639" y1="194" x2="646" y2="260" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<text x="380" y="336" font-size="12" fill="#5F5E5A" text-anchor="middle">solid = always compiled · dashed = optional module &amp; the dependency its include pulls in</text>
</svg>
